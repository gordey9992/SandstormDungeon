name: Непрерывная интеграция

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  quality:
    name: Проверка качества кода
    runs-on: ubuntu-latest
    
    steps:
    - name: Клонировать код
      uses: actions/checkout@v4
      
    - name: Установить Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Кэш Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: maven-${{ hashFiles('**/pom.xml') }}
        
    - name: Проверить компиляцию
      run: mvn compile -q
      
    - name: Проверить синтаксис
      run: mvn checkstyle:check
      
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: Клонировать код
      uses: actions/checkout@v4
      
    - name: Установить Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Кэш Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: maven-${{ hashFiles('**/pom.xml') }}
        
    - name: Запустить тесты
      run: mvn test
      
    - name: Собрать JAR
      run: mvn clean package -DskipTests
      
    - name: Проверить размер JAR
      run: |
        JAR_SIZE=$(stat -c%s target/*.jar)
        echo "Размер JAR: $((JAR_SIZE / 1024)) KB"
        if [ $JAR_SIZE -gt 50000000 ]; then
          echo "❌ Слишком большой JAR файл!"
          exit 1
        fi
        
    - name: Загрузить артефакт
      uses: actions/upload-artifact@v4
      with:
        name: Плагин-Песчаный-Данж
        path: target/SandstormDungeon-*.jar
        retention-days: 7
        
    - name: Уведомить Discord (опционально)
      if: success()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
