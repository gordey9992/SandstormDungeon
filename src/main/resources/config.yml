# Конфигурация Песчаного Данжа

песчаная-буря:
  включена: true
  плотность-частиц: 50
  радиус-бури: 100
  сила-ветра: 3
  двигать-блоки: true
  affected-blocks:
    - SAND
    - SANDSTONE
    - RED_SAND
    - GRAVEL

подземелья:
  древний-храм:
    мир: world
    центр-х: 100
    центр-z: 100
    радиус: 150
    структура:
      мин-y: 60
      макс-y: 80
    лут:
      шанс-древнего-свитка: 15
      шанс-редкого-артефакта: 5
      
  затерянный-оазис:
    мир: world
    центр-х: -200
    центр-z: 300
    радиус: 120
    структура:
      мин-y: 65
      макс-y: 75
    лут:
      шанс-древнего-свитка: 20
      шанс-редкого-артефакта: 8

сообщения:
  вход-в-данж: "&6Вы вошли в зону песчаной бури! Древний храм где-то рядом..."
  лут-найден: "&eВы нашли древний артефакт!"
  буря-активна: "&cПесчаная буря активна! Будьте осторожны."
  буря-остановлена: "&aПесчаная буря остановлена."
  не-в-пустыне: "&cПесчаная буря может быть только в пустыне!"
